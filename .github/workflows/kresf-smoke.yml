name: KRESF static checks
on:
  pull_request:
  push:
    branches: [main, development/kresf-rectification-v3]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate educational PWA source
        run: node tests/smoke.test.mjs
