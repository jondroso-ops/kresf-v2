name: Verify published KRESF site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Verify public pages and exact deployed release on main
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base="https://jondroso-ops.github.io/kresf-v2/"
          ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 15 "${base}" -o /tmp/kresf-site.html &&
               curl -fsSL --max-time 15 "${base}app/" -o /tmp/kresf-app.html &&
               curl -fsSL --max-time 15 "${base}app/manifest.webmanifest" -o /tmp/kresf-manifest.json &&
               grep -q 'A safer road' /tmp/kresf-site.html &&
               grep -q 'kresf-habitat-scene' /tmp/kresf-app.html &&
               grep -q 'id="habitat-start"' /tmp/kresf-app.html &&
               grep -q '"display": "standalone"' /tmp/kresf-manifest.json; then
              # Pull requests test the existing production site only; they must
              # never require unpublished PR source to match the live release.
              if [[ "${EVENT_NAME}" == "pull_request" ]]; then
                echo "PASS: production site health checked (PR source not deployed)."
                ok=1
                break
              fi
              # Compare deployed bytes to exactly the checked-out main commit.
              # Text markers alone cannot prove the new release was published.
              if curl -fsSL --max-time 15 "${base}app/sw.js" -o /tmp/kresf-sw.js &&
                 curl -fsSL --max-time 15 "${base}app/styles/tailwind.css" -o /tmp/kresf-tailwind.css &&
                 cmp -s index.html /tmp/kresf-site.html &&
                 cmp -s app/index.html /tmp/kresf-app.html &&
                 cmp -s app/sw.js /tmp/kresf-sw.js &&
                 cmp -s app/styles/tailwind.css /tmp/kresf-tailwind.css &&
                 cmp -s app/manifest.webmanifest /tmp/kresf-manifest.json; then
                echo "PASS: live website, PWA, worker, CSS and manifest match commit ${GITHUB_SHA}."
                ok=1
                break
              fi
            fi
            echo "Production Pages does not yet match checked-out release (attempt ${attempt}); retrying."
            sleep 12
          done
          if [[ "${ok}" != 1 ]]; then
            echo "::error::GitHub Pages did not serve the expected release within verification window."
            exit 1
          fi
